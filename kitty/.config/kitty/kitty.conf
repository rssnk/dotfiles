# include ./Dark_Pastel.conf
# include current-theme.conf
include ./st_theme.conf

cursor_blink_interval 0
font_family      JetBrainsMono Nerd Font Mono
font_size        16.0
disable_ligatures always
font_features JetBrainsMono Nerd Font Mono -liga

confirm_os_window_close 0

enable_audio_bell no

map control+equal change_font_size all 0

# map --allow-fallback=shifted,ascii control+shift+p scroll_line_up
# map --allow-fallback=shifted,ascii control+shift+n scroll_line_down
# map --allow-fallback=shifted,ascii control+shift+k scroll_page_up
# map --allow-fallback=shifted,ascii control+shift+j scroll_page_down
map --allow-fallback=shifted,ascii alt+p scroll_line_up
map --allow-fallback=shifted,ascii alt+n scroll_line_down
map --allow-fallback=shifted,ascii alt+k scroll_page_up
map --allow-fallback=shifted,ascii alt+j scroll_page_down

copy_on_select yes

mouse_map left click ungrabbed mouse_click_url
# map ctrl+l clear_terminal scroll active

map --allow-fallback=shifted,ascii ctrl+l combine : clear_terminal scroll active : send_text normal,application \x0c
