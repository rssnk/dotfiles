# include ./Dark_Pastel.conf
include ./st_theme.conf

font_family      JetBrainsMono Nerd Font Mono
font_size        16.0
disable_ligatures always
font_features JetBrainsMono Nerd Font Mono -liga

confirm_os_window_close 0

enable_audio_bell no

map control+plus change_font_size all +2.0
map control+minus change_font_size all -2.0
map control+equal change_font_size all 0

map control+shift+p scroll_line_up
map control+shift+n scroll_line_down
map control+shift+k scroll_page_up
map control+shift+j scroll_page_down

copy_on_select yes
